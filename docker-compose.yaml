services:
  npm:
    container_name: npm
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - 80:80 # http
      - 4344:81 # for web interface
      - 443:443 # https
    volumes:
      - ${CONTAINER_DIR}/npm/data:/data
      - ${CONTAINER_DIR}/npm/letsencrypt:/etc/letsencrypt
      - ${CONTAINER_DIR}/npm/custom/proxy.conf:/etc/nginx/conf.d/include/proxy.conf

  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Singapore
    group_add:
      - "104"
    devices:
      #- /dev/dri:/dev/dri
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    volumes:
      - ${CONTAINER_DIR}/media_server/jellyfin/config:/config
      - ${SENTINEL_DIR}/media_server/media/tvshows:/data/tvshows
      - ${SENTINEL_DIR}/media_server/media/movies:/data/movies
    ports:
      - 8096:8096
        #- 8920:8920 #optional
        #- 7359:7359/udp #optional
        #- 1900:1900/udp #optional
    restart: unless-stopped

  sonarr:
    container_name: sonarr
    image: linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Singapore
    volumes:
      - ${CONTAINER_DIR}/media_server/sonarr/config:/config
      - ${SENTINEL_DIR}/media_server/media/tvshows:/tv #optional
      - ${SENTINEL_DIR}/media_server/downloads/complete:/downloads #optional
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Singapore
    volumes:
      - ${CONTAINER_DIR}/media_server/radarr/config:/config
      - ${SENTINEL_DIR}/media_server/media/movies:/movies #optional
      - ${SENTINEL_DIR}/media_server/downloads/complete:/downloads #optional
    ports:
      - 7878:7878
    restart: unless-stopped

  sabnzbd:
    container_name: sabnzbd
    image: linuxserver/sabnzbd:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Singapore
    volumes:
      - ${CONTAINER_DIR}/media_server/sabnzbd/config:/config
      - ${SENTINEL_DIR}/media_server/downloads/complete:/downloads #optional
      - ${SENTINEL_DIR}/media_server/downloads/incomplete:/incomplete-downloads #optional
    ports:
      - 6767:8080
    dns:
      - "192.168.1.1"
    restart: unless-stopped

  jellyseerr:
    container_name: jellyseerr
    image: fallenbagel/jellyseerr:latest
    environment:
         - LOG_LEVEL=debug
         - TZ=Asia/Singapore
    ports:
         - 5055:5055
    volumes:
         - ${CONTAINER_DIR}/media_server/jellyseerr/config:/app/config
    restart: unless-stopped

  mqtt:
    container_name: mqtt
    image: eclipse-mosquitto
    ports:
      - 1883:1883
      - 9001:9001
    volumes:
      - ${CONTAINER_DIR}/smart_home/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ${CONTAINER_DIR}/smart_home/mosquitto/data:/mosquitto/data
      - ${CONTAINER_DIR}/smart_home/mosquitto/log:/mosquitto/log
    restart: unless-stopped

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt
    ports:
      - 8081:8080
    devices:
      - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_f8b77f547945ed11ad45ca8f0a86e0b4-if00-port0:/dev/ttyUSB0
    volumes:
      - ${CONTAINER_DIR}/smart_home/zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    environment:
      - TZ=Asia/Singapore
    restart: unless-stopped
    depends_on:
      - mqtt
      - homeassistant

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: "host"
    volumes:
      - ${CONTAINER_DIR}/smart_home/homeassistant:/config
    environment:
      - TZ=Asia/Singapore
    privileged: true
    restart: unless-stopped

  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    ports:
      - 3000:3000
    volumes:
      - ${CONTAINER_DIR}/homepage/config:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock:ro # optional, for docker integrations
      - /sentinel:/disk
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=192.168.1.3:3000
    restart: unless-stopped

  scrutiny:
    container_name: scrutiny
    image: ghcr.io/analogj/scrutiny:master-omnibus
    cap_add:
      - SYS_RAWIO
    ports:
      - 1111:8080 # webapp
      - 1112:8086 # influxDB admin
    volumes:
      - /run/udev:/run/udev:ro
      - ${CONTAINER_DIR}/scrutiny/config:/opt/scrutiny/config
      - ${CONTAINER_DIR}/scrutiny/influxdb:/opt/scrutiny/influxdb
    environment:
      - DEBUG=true
      - SCRUTINY_LOG_FILE=/tmp/web.log
      - COLLECTOR_LOG_FILE=/tmp/collector.log
    devices:
      - /dev/sda
      - /dev/sdb
      - /dev/sdc
      - /dev/sdd
      - /dev/sde
    restart: unless-stopped

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    volumes:
      - ${SENTINEL_DIR}/file_server/immich/upload:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich-database
      REDIS_HOSTNAME: immich-redis
    env_file:
      - .env
    ports:
      - 2283:2283
    depends_on:
      - immich-redis
      - immich-database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    volumes:
      - ${SENTINEL_DIR}/file_server/immich/model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  immich-redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:5b8f8c333bef895c925f56629d6ba90aea95a4f7391f62411e625267c600b19c
    env_file:
      - .env
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  immich-database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:32324a2f41df5de9efe1af166b7008c3f55646f8d0e00d9550c16c9822366b4a
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${SENTINEL_DIR}/file_server/immich/database:/var/lib/postgresql/data
    env_file:
      - .env
    restart: always

  paperless-broker:
    container_name: paperless-broker
    image: docker.io/library/redis:7
    restart: unless-stopped
    volumes:
      - ${SENTINEL_DIR}/file_server/paperless/redis:/data

  paperless-db:
    container_name: paperless-db
    image: docker.io/library/postgres:15
    restart: unless-stopped
    volumes:
      - ${SENTINEL_DIR}/file_server/paperless/database:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PAPERLESS_DB_NAME}
      POSTGRES_USER: ${PAPERLESS_DB_USER}
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}

  paperless-webserver:
    container_name: paperless-server
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - paperless-db
      - paperless-broker
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ${SENTINEL_DIR}/file_server/paperless/data:/usr/src/paperless/data
      - ${SENTINEL_DIR}/file_server/paperless/media:/usr/src/paperless/media
      - ${CONTAINER_DIR}/file_server/paperless/export:/usr/src/paperless/export
      - ${CONTAINER_DIR}/file_server/paperless/consume:/usr/src/paperless/consume
    env_file:
      - .env
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db

  wikijs_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD: ${WIKIJS_DB_PASS}
      POSTGRES_USER: wikijs
    logging:
      driver: none
    restart: unless-stopped
    volumes:
      - ${SENTINEL_DIR}/file_server/db-data:/var/lib/postgresql/data

  wikijs:
    image: ghcr.io/requarks/wiki:2
    depends_on:
      - wikijs_db
    environment:
      DB_TYPE: postgres
      DB_HOST: wikijs_db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${WIKIJS_DB_PASS}
      DB_NAME: wiki
    restart: unless-stopped
    ports:
      - 3002:3000

  calibre-web:
    container_name: calibre-web
    image: lscr.io/linuxserver/calibre-web:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Singapore
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    volumes:
      - ${CONTAINER_DIR}/file_server/calibre-web/config:/config
      - ${SENTINEL_DIR}/file_server/calibre-web/library:/books
    ports:
      - 8083:8083
    restart: unless-stopped

  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - TZ=Asia/Singapore
